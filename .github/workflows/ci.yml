name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build app
        run: dotnet build Systenclin/Systenclin.csproj -c Release

      - name: Run core verification harness
        run: dotnet run -c Release --project Testes/Systenclin.Testes/Systenclin.Testes.csproj
